<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 逐字稿</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#f8fafc;color:#1e293b;font-family:"Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif}
  main{max-width:1040px;margin:0 auto;padding:32px 16px 48px;display:grid;gap:20px}
  header{text-align:center} header h1{margin:0;font-size:1.9rem;letter-spacing:-.01em;color:#0f172a} header p{margin:.35rem 0 0;color:#64748b;font-size:.9rem}
  .card{background:#fff;border:1px solid #e2e8f0;border-radius:18px;padding:22px}
  .row{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}
  .drop{border:2px dashed #cbd5e1;border-radius:18px;padding:30px 20px;text-align:center;cursor:pointer;background:#fff;transition:.2s}
  .drop:hover,.drop.on{border-color:#14b8a6;background:#f0fdfa}
  .drop svg{width:48px;height:48px;color:#14b8a6}
  .drop b{display:block;margin-top:10px;font-size:1.05rem}
  .muted{color:#64748b;font-size:.8rem} .name{color:#0f766e;font-size:.88rem;margin-top:10px;word-break:break-all}
  .tpl{display:flex;flex-direction:column;justify-content:center}
  .btn{border:0;border-radius:12px;padding:10px 16px;font-weight:600;font-size:.9rem;cursor:pointer;font-family:inherit;transition:.15s}
  .btn:disabled{opacity:.35;cursor:not-allowed}
  .dark{background:#0f172a;color:#fff} .dark:hover:not(:disabled){background:#334155}
  .teal{background:#0d9488;color:#fff} .teal:hover:not(:disabled){background:#14b8a6}
  .soft{background:#f1f5f9;color:#334155;display:inline-flex;align-items:center;gap:6px;margin-top:14px;align-self:flex-start} .soft:hover{background:#e2e8f0}
  .prog{display:grid;grid-template-columns:auto 1fr;gap:28px;align-items:center}
  .ring{position:relative;width:210px;height:210px}
  .ring svg{width:100%;height:100%;transform:rotate(-90deg)}
  .ring .trk{stroke:#e2e8f0} .ring .bar{stroke:url(#g);stroke-linecap:round;transition:stroke-dashoffset .6s ease}
  .ring .ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .ring .pct{font-size:2.6rem;font-weight:700;font-variant-numeric:tabular-nums;color:#0f172a}
  .ring .eta{font-size:.78rem;color:#64748b;margin-top:2px;text-align:center;padding:0 18px}
  #stage{font-size:1.15rem;font-weight:600;margin:0} #sub{margin:.4rem 0 0;color:#64748b;font-size:.88rem}
  video{width:100%;max-height:230px;border-radius:12px;background:#000;margin-top:14px}
  .hidden{display:none!important}
  .bar2{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:12px} .bar2 h2{margin:0 auto 0 0;font-size:1.05rem}
  #tx{height:520px;overflow-y:auto;border:1px solid #f1f5f9;border-radius:12px;padding:4px 12px;font-size:15px}
  #tx .u{padding:7px 2px;border-bottom:1px solid #f1f5f9;line-height:1.75}
  #tx .ts{font-family:ui-monospace,Consolas,monospace;font-size:.8rem;color:#0d9488;text-decoration:underline;text-underline-offset:3px;cursor:pointer;margin-right:6px}
  #tx .sp{font-weight:700;margin-right:4px} #tx .zh{color:#0369a1}
  #tx .warn{background:#fffbeb} #tx .gap{background:#fef2f2;color:#b91c1c}
  #tx .tag{font-size:.7rem;border-radius:5px;padding:0 6px;margin-left:6px;background:#fef3c7;color:#92400e}
  #tx .empty{color:#94a3b8;text-align:center;padding:30px 0;font-size:.9rem}
  .note{color:#94a3b8;font-size:.76rem;margin:.8rem 0 0}
  @media(max-width:760px){.row,.prog{grid-template-columns:1fr}.ring{margin:0 auto}}
</style>
</head>
<body>
<main>
  <header><h1>AI 逐字稿</h1><p>免費・不需帳號・影音只在你的電腦處理，不會上傳</p></header>
  <section class="row">
    <div id="drop" class="drop">
      <svg fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 16V4m0 0-4 4m4-4 4 4M4 16v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2"/></svg>
      <b>拖曳或點選影音檔</b>
      <div class="muted">MP3、MP4、MKV、M4A、WAV、MOV、AVI、FLV、WMV…｜支援 10GB、10 小時以上</div>
      <div id="fname" class="name"></div>
      <input id="file" type="file" class="hidden">
    </div>
    <div class="card tpl">
      <b>會議記錄 Word 範本（選填）</b>
      <div class="muted" style="margin-top:4px">上傳空白範本，完成後依範本產出會議記錄；未上傳則使用標準格式。</div>
      <label class="btn soft">選擇 .docx<input id="tpl" type="file" accept=".docx" class="hidden"></label>
      <div id="tplName" class="name"></div>
    </div>
  </section>
  <section class="card prog">
    <div class="ring">
      <svg viewBox="0 0 200 200"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14b8a6"/><stop offset="1" stop-color="#0ea5e9"/></linearGradient></defs>
        <circle cx="100" cy="100" r="88" fill="none" stroke-width="12" class="trk"/>
        <circle id="ring" cx="100" cy="100" r="88" fill="none" stroke-width="12" class="bar" stroke-dasharray="552.92" stroke-dashoffset="552.92"/></svg>
      <div class="ctr"><span id="pct" class="pct">0%</span><span id="eta" class="eta">等待檔案</span></div>
    </div>
    <div>
      <p id="stage">選擇影音檔後自動開始</p>
      <p id="sub"></p>
      <video id="player" controls preload="metadata" class="hidden"></video>
    </div>
  </section>
  <section class="card">
    <div class="bar2">
      <h2>逐字稿</h2>
      <button id="bTxt" class="btn dark" disabled>匯出逐字稿 (TXT)</button>
      <button id="bSrt" class="btn dark" disabled>匯出字幕 (SRT)</button>
      <button id="bDoc" class="btn teal" disabled>下載會議記錄 (.docx)</button>
    </div>
    <div id="tx"><div class="empty">逐字稿會在這裡逐段出現</div></div>
    <p class="note">點時間可跳到該處播放。黃底為系統偵測到需確認的句子；紅底為有聲音但未辨識出文字的片段，請以原音核對。外語括號內為機器翻譯。</p>
  </section>
</main>
<script>
/* ===== CORE：容器解析（MP4/MOV/M4A、MP3、AAC、WAV、MKV/WebM、AVI、FLV），以 File.slice() 分段讀取，不整檔載入 ===== */
const CORE = (() => {
  const td = new TextDecoder('latin1');
  const str = (b, p, n) => td.decode(b.subarray(p, p + n));
  const u16 = (b, p) => (b[p] << 8) | b[p + 1];
  const u24 = (b, p) => (b[p] << 16) | (b[p + 1] << 8) | b[p + 2];
  const u32 = (b, p) => ((b[p] << 24) >>> 0) + (b[p + 1] << 16) + (b[p + 2] << 8) + b[p + 3];
  const u64 = (b, p) => u32(b, p) * 4294967296 + u32(b, p + 4);
  const le16 = (b, p) => b[p] | (b[p + 1] << 8);
  const le32 = (b, p) => (b[p] | (b[p + 1] << 8) | (b[p + 2] << 16)) + b[p + 3] * 16777216;
  const le64 = (b, p) => le32(b, p) + le32(b, p + 4) * 4294967296;

  async function readBytes(file, start, end) {
    end = Math.min(end, file.size);
    if (end <= start) return new Uint8Array(0);
    return new Uint8Array(await file.slice(start, end).arrayBuffer());
  }
  /* 有快取視窗的讀取器（回傳的 subarray 只在下一次讀取前有效；要保存請 slice） */
  class Reader {
    constructor(file, win = 8 << 20) { this.f = file; this.win = win; this.s = 0; this.b = new Uint8Array(0); }
    get size() { return this.f.size; }
    async bytes(pos, n) {
      if (pos >= this.s && pos + n <= this.s + this.b.length) return this.b.subarray(pos - this.s, pos - this.s + n);
      this.b = await readBytes(this.f, pos, pos + Math.max(this.win, n)); this.s = pos;
      return this.b.subarray(0, Math.min(n, this.b.length));
    }
  }

  /* ---------- 共用：AAC / MP3 ---------- */
  const SR_TABLE = [96000, 88200, 64000, 48000, 44100, 32000, 24000, 22050, 16000, 12000, 11025, 8000, 7350];
  function parseASC(asc) {
    let bit = 0;
    const rd = n => { let v = 0; for (let i = 0; i < n; i++) { v = (v << 1) | ((asc[bit >> 3] >> (7 - (bit & 7))) & 1); bit++; } return v; };
    let aot = rd(5); if (aot === 31) aot = 32 + rd(6);
    let sfi = rd(4); const freq = sfi === 15 ? rd(24) : SR_TABLE[sfi];
    const chan = rd(4); let core = aot;
    if (aot === 5 || aot === 29) { const es = rd(4); if (es === 15) rd(24); core = rd(5); if (core === 31) core = 32 + rd(6); }
    return { aot, coreAot: core, sfi, freq, chan };
  }
  function makeASC(sr, ch) {
    let sfi = SR_TABLE.indexOf(sr); if (sfi < 0) sfi = 4;
    return new Uint8Array([(2 << 3) | (sfi >> 1), ((sfi & 1) << 7) | ((ch & 15) << 3)]);
  }
  function aacTrack(asc) {
    const a = parseASC(asc);
    if (a.coreAot < 1 || a.coreAot > 4 || a.sfi === 15 || !a.freq) throw new Error('不支援的 AAC 設定');
    return { codec: 'aac', asc, sr: a.freq, ch: a.chan || 2, frameDur: 1024 / a.freq, aot: a.aot, coreAot: a.coreAot, sfi: a.sfi, chanCfg: a.chan || 2 };
  }
  const BR = {
    0: [0, 32, 64, 96, 128, 160, 192, 224, 256, 288, 320, 352, 384, 416, 448], 1: [0, 32, 48, 56, 64, 80, 96, 112, 128, 160, 192, 224, 256, 320, 384],
    2: [0, 32, 40, 48, 56, 64, 80, 96, 112, 128, 160, 192, 224, 256, 320], 3: [0, 32, 48, 56, 64, 80, 96, 112, 128, 144, 160, 176, 192, 224, 256],
    4: [0, 8, 16, 24, 32, 40, 48, 56, 64, 80, 96, 112, 128, 144, 160]
  };
  const MP3_SR = { 3: [44100, 48000, 32000], 2: [22050, 24000, 16000], 0: [11025, 12000, 8000] };
  /* MPEG 音訊（Layer I/II/III）或 ADTS 音框標頭 */
  function frameHeader(b, p) {
    if (p + 7 > b.length || b[p] !== 0xff || (b[p + 1] & 0xe0) !== 0xe0) return null;
    const b1 = b[p + 1], b2 = b[p + 2], layer = (b1 >> 1) & 3;
    if (layer === 0) {
      if ((b1 & 0xf6) !== 0xf0) return null;

      const len = ((b[p + 3] & 3) << 11) | (b[p + 4] << 3) | (b[p + 5] >> 5); if (len < 7) return null;
      const prot = !(b1 & 1);

    }
    const ver = (b1 >> 3) & 3; if (ver === 1) return null;
    const bri = b2 >> 4, sri = (b2 >> 2) & 3, pad = (b2 >> 1) & 1;
    if (bri === 0 || bri === 15 || sri === 3) return null;
    const L = 4 - layer, tbl = ver === 3 ? (L === 1 ? 0 : L === 2 ? 1 : 2) : (L === 1 ? 3 : 4);
    const br = BR[tbl][bri] * 1000, sr = MP3_SR[ver][sri], ch = ((b[p + 3] >> 6) === 3) ? 1 : 2;
    if (L === 1) return { type: 'mp3', len: (Math.floor(12 * br / sr) + pad) * 4, samples: 384, sr, ch, layer: L };
    if (L === 3 && ver !== 3) return { type: 'mp3', len: Math.floor(72 * br / sr) + pad, samples: 576, sr, ch, layer: L };
    return { type: 'mp3', len: Math.floor(144 * br / sr) + pad, samples: 1152, sr, ch, layer: L };
  }
  const isInfoFrame = (b, p, len) => { const s = td.decode(b.subarray(p + 4, p + Math.min(len, 60))); return /Xing|Info|VBRI/.test(s); };
  /* 把任意切割的 MP3 位元流重新切成完整音框 */
  class MP3Framer {
    constructor() { this.buf = new Uint8Array(0); this.t = 0; this.sr = 0; }
    push(bytes, t) {
      if (this.t === 0 && t != null && this.n == null) this.t = t;
      const b = new Uint8Array(this.buf.length + bytes.length); b.set(this.buf); b.set(bytes, this.buf.length);
      const out = []; let p = 0;
      while (p + 4 <= b.length) {
        const h = frameHeader(b, p);
        if (!h || h.type !== 'mp3') { p++; continue; }

        const nx = p + h.len;
        if (nx + 4 <= b.length) { const h2 = frameHeader(b, nx); if (!h2 || h2.type !== 'mp3') { p++; continue; } }
        if (!this.n && isInfoFrame(b, p, h.len)) { this.n = 1; p = nx; continue; }
        out.push({ t: this.t, d: h.samples / h.sr, data: b.slice(p, nx) });
        this.t += h.samples / h.sr; this.sr = h.sr; this.n = (this.n || 0) + 1; p = nx;
      }
      this.buf = b.slice(p);
      return out;
    }
  }

  /* ---------- MP4 / MOV / M4A ---------- */
  function* children(b, start, end) {
    let p = start;
    while (p + 8 <= end) {
      let size = u32(b, p); const type = str(b, p + 4, 4); let hdr = 8;
      if (size === 1) { size = u64(b, p + 8); hdr = 16; } else if (size === 0) size = end - p;
      if (size < hdr || p + size > end) break;
      yield { type, start: p + hdr, end: p + size };
      p += size;
    }
  }
  const child = (b, box, type) => { for (const c of children(b, box.start, box.end)) if (c.type === type) return c; return null; };
  function readDesc(b, p) { const tag = b[p++]; let len = 0; for (let i = 0; i < 4; i++) { const x = b[p++]; len = (len << 7) | (x & 0x7f); if (!(x & 0x80)) break; } return { tag, len, p }; }
  function parseEsds(b, p, end) {
    p += 4; let d = readDesc(b, p); if (d.tag !== 0x03) return null;
    p = d.p + 2; const fl = b[p++]; if (fl & 0x80) p += 2; if (fl & 0x40) p += 1 + b[p]; if (fl & 0x20) p += 2;
    d = readDesc(b, p); if (d.tag !== 0x04) return null;
    const oti = b[d.p]; p = d.p + 13;
    while (p < end) { d = readDesc(b, p); if (d.tag === 0x05) return { oti, asc: b.slice(d.p, d.p + d.len) }; p = d.p + d.len; }
    return { oti, asc: null };
  }
  class MP4Demux {
    constructor(file) { this.file = file; this.name = 'MP4/MOV'; }
    async open() {
      const f = this.file; let pos = 0, moov = null; this.moofs = [];
      while (pos + 8 <= f.size) {
        const h = await readBytes(f, pos, pos + 16);
        let size = u32(h, 0); const type = str(h, 4, 4);
        if (size === 1) size = u64(h, 8); else if (size === 0) size = f.size - pos;
        if (size < 8) break;
        if (type === 'moov') moov = await readBytes(f, pos, pos + size);
        else if (type === 'moof') this.moofs.push([pos, size]);
        pos += size;
      }
      if (!moov) throw new Error('找不到 moov');
      const b = moov; let mdia = null, tkhdId = 0;
      for (const trak of children(b, 8, b.length)) {
        if (trak.type !== 'trak') continue;
        const m = child(b, trak, 'mdia'); if (!m) continue;
        const hd = child(b, m, 'hdlr'); if (!hd || str(b, hd.start + 8, 4) !== 'soun') continue;
        const tk = child(b, trak, 'tkhd'); if (tk) tkhdId = b[tk.start] === 1 ? u32(b, tk.start + 20) : u32(b, tk.start + 12);
        mdia = m; break;
      }
      if (!mdia) throw new Error('沒有音軌');
      const mdhd = child(b, mdia, 'mdhd'); const ts = b[mdhd.start] === 1 ? u32(b, mdhd.start + 20) : u32(b, mdhd.start + 12);
      const stbl = child(b, child(b, mdia, 'minf'), 'stbl');
      const stsd = child(b, stbl, 'stsd'); const ent = stsd.start + 8, entSize = u32(b, ent), fmt = str(b, ent + 4, 4);
      const ver = u16(b, ent + 16), ch0 = u16(b, ent + 24), bits0 = u16(b, ent + 26), sr0 = u32(b, ent + 32) / 65536;
      let track = null;
      if (fmt === 'mp4a') {
        let esds = null;
        for (let p = ent + 28; p < ent + entSize - 4; p++) if (b[p] === 0x65 && str(b, p, 4) === 'esds') { esds = parseEsds(b, p + 4, p - 4 + u32(b, p - 4)); break; }
        if (esds && (esds.oti === 0x69 || esds.oti === 0x6b)) track = { codec: 'mp3', sr: sr0 || ts, ch: ch0 || 2 };
        else if (esds && esds.asc && (esds.oti === 0x40 || (esds.oti >= 0x66 && esds.oti <= 0x68))) track = aacTrack(esds.asc);
        else if (!esds && ver < 2) track = aacTrack(makeASC(sr0 || ts, ch0 || 2));
        else throw new Error('不支援的 mp4a 編碼');
      } else if (fmt === '.mp3' || fmt === 'ms\u0000U') track = { codec: 'mp3', sr: sr0 || ts, ch: ch0 || 2 };
      else if (['sowt', 'twos', 'lpcm', 'in24', 'in32', 'fl32', 'fl64', 'raw ', 'NONE'].includes(fmt)) {
        let bits = bits0, ch = ch0, sr = sr0 || ts, le = fmt === 'sowt' || fmt === 'raw ', flt = false, sgn = fmt !== 'raw ';
        if (fmt === 'in24') bits = 24; if (fmt === 'in32') bits = 32; if (fmt === 'fl32') { bits = 32; flt = true; } if (fmt === 'fl64') { bits = 64; flt = true; } if (fmt === 'raw ') bits = 8;
        if (ver === 2) { sr = (() => { const dv = new DataView(b.buffer, b.byteOffset + ent + 40, 8); return dv.getFloat64(0); })(); ch = u32(b, ent + 48); bits = u32(b, ent + 56); const fl = u32(b, ent + 60); flt = !!(fl & 1); le = !(fl & 2); sgn = !!(fl & 4) || flt; }
        if (fmt === 'in24' || fmt === 'in32' || fmt === 'fl32' || fmt === 'fl64') {
          for (let p = ent + 36; p < ent + entSize - 8; p++) if (str(b, p, 4) === 'enda') { le = u16(b, p + 4) === 1; break; }
        }
        track = { codec: 'pcm', sr, ch: ch || 1, bits, flt, le, sgn, bpf: (ch || 1) * bits / 8 };
      } else throw new Error('不支援的音訊編碼 ' + fmt);
      this.track = track; this.ts = ts;
      // 樣本表
      const stsz = child(b, stbl, 'stsz'); const fixed = u32(b, stsz.start + 4), N = u32(b, stsz.start + 8);
      this.frag = N === 0 && this.moofs.length > 0; this.trackId = tkhdId;
      if (!this.frag) {
        if (!N) throw new Error('音軌無樣本');
        const sizes = new Uint32Array(N); for (let i = 0; i < N; i++) sizes[i] = fixed || u32(b, stsz.start + 12 + i * 4);
        let co = child(b, stbl, 'stco'), is64 = false; if (!co) { co = child(b, stbl, 'co64'); is64 = true; }
        const nc = u32(b, co.start + 4), chunkOff = new Float64Array(nc);
        for (let i = 0; i < nc; i++) chunkOff[i] = is64 ? u64(b, co.start + 8 + i * 8) : u32(b, co.start + 8 + i * 4);
        const stsc = child(b, stbl, 'stsc'), ns = u32(b, stsc.start + 4), sc = [];
        for (let i = 0; i < ns; i++) { const q = stsc.start + 8 + i * 12; sc.push([u32(b, q), u32(b, q + 4)]); }
        const stts = child(b, stbl, 'stts'), nt = u32(b, stts.start + 4), times = new Float64Array(N + 1); let t = 0, idx = 0;
        for (let i = 0; i < nt; i++) { const q = stts.start + 8 + i * 8, cnt = u32(b, q), d = u32(b, q + 4); for (let k = 0; k < cnt && idx < N; k++) { times[idx++] = t / ts; t += d; } }
        while (idx < N) { times[idx++] = t / ts; t += track.codec === 'pcm' ? 1 : 1024; }
        times[N] = t / ts;
        if (track.codec === 'pcm') {
          // PCM：以 chunk 為封包（樣本＝音框）
          const pk = []; let si = 0;
          for (let c = 0; c < nc && si < N; c++) {
            let spc = 0; for (let k = sc.length - 1; k >= 0; k--) if (sc[k][0] <= c + 1) { spc = sc[k][1]; break; }
            const n = Math.min(spc, N - si);
            const bytesPer = (fixed > 1 && fixed !== track.bpf) ? fixed : track.bpf;
            pk.push([chunkOff[c], n * bytesPer, times[si], n / track.sr]); si += n;
          }
          this.pk = pk;
        } else {
          const offs = new Float64Array(N); let si = 0;
          for (let c = 0; c < nc && si < N; c++) {
            let spc = 0; for (let k = sc.length - 1; k >= 0; k--) if (sc[k][0] <= c + 1) { spc = sc[k][1]; break; }
            let o = chunkOff[c]; for (let k = 0; k < spc && si < N; k++) { offs[si] = o; o += sizes[si]; si++; }
          }
          this.N = N; this.sizes = sizes; this.offs = offs; this.times = times;
        }

  await translate(utts);
  if (!S.utts.length) $('tx').innerHTML = '';
  S.utts.push(...utts); $('tx').insertAdjacentHTML('beforeend', utts.map(rowHtml).join('')); $('tx').scrollTop = 1e9;
  return true;
}

/* ---------- 主流程 ---------- */
let wakeLock = null;
async function keepAwake() { try { if ('wakeLock' in navigator && document.visibilityState === 'visible') wakeLock = await navigator.wakeLock.request('screen'); } catch { } }
document.addEventListener('visibilitychange', () => { if (S.running && document.visibilityState === 'visible') keepAwake(); });
async function selectFile(file) {
  if (S.running) { if (!confirm('目前正在處理，要改處理新檔案嗎？（目前進度已自動保存）')) return; S.stop = true; while (S.running) await sleep(200); }
  Object.assign(S, { file, key: `${file.name}|${file.size}|${file.lastModified}`, duration: 0, processed: 0, wins: [], online: null, liveT: [], liveL: [], final: null, utts: [], tr: {}, stop: false, playable: false, listenBuilt: 0, srcKind: '', stats: { recheck: 0, removed: 0 }, spkLang: {} });
  $('fname').textContent = `${file.name}（${file.size >= 1073741824 ? (file.size / 1073741824).toFixed(2) + ' GB' : (file.size / 1048576).toFixed(1) + ' MB'}）`;
  if (!$('tplName').textContent) $('tplName').textContent = '';
  $('tx').innerHTML = '<div class="empty">逐字稿會在這裡逐段出現</div>'; ['bTxt', 'bSrt', 'bDoc'].forEach(i => $(i).disabled = true);
  setPlayer(null); ring(0, '準備中');
  run();
}
async function run() {
  S.running = true; keepAwake();
  try {
    stage('分析檔案', '');
    S.playable = await canPlay(S.file);
    if (S.playable) setPlayer(S.file);
    const src = await openSource(S.file);
    S.srcKind = src.kind; S.duration = src.duration || 0; dbg('來源', src.kind, S.duration);
    const meta = await DB.get(S.key + '|meta'); let fromSec = 0;
    if (meta && meta.nWin && meta.v === VERSION) {
      for (let i = 0; i < meta.nWin; i++) { const r = await DB.get(S.key + '|w|' + i); if (!r) break; S.wins.push(r); addOnline(r); }
      S.tr = meta.tr || {}; fromSec = S.wins.length ? S.wins[S.wins.length - 1].e : 0; S.processed = fromSec;
    }
    await loadOpenCC();
    if (S.wins.length) { S.utts = decorate(LOGIC.buildUtterances(itemsOf(S.wins), spkAtFn(S.liveT, S.liveL))); render(); }
    await ensureModels();
    S.t0 = performance.now(); S.p0 = fromSec;
    stage(src.kind === 'ffmpeg' ? '轉檔並辨識中' : '辨識中', ''); progress();
    let pend = new Float32Array(0), pStart = fromSec, first = true;
    const cat = (a, b) => { const c = new Float32Array(a.length + b.length); c.set(a); c.set(b, a.length); return c; };
    const drain = async final => {
      while (!S.stop && (pend.length >= WIN * SR || (final && pend.length > SR * 0.3))) {
        const cut = pend.length > WIN * SR ? CORE.findCut(pend, SR, MINW, WIN - 0.2) : pend.length;
        const seg = pend.slice(0, cut); if (pend.failed) seg.failed = true;
        if (!await processWindow(seg, pStart)) return;
        pStart += cut / SR; const f = pend.failed; pend = pend.slice(cut); if (f) pend.failed = true;
      }
      if (final) pend = new Float32Array(0);
    };
    for await (const blk of src.blocks(fromSec)) {
      if (S.stop) break;
      let pcm = blk.pcm16; const failed = !!pcm.failed; let bs = blk.startSec;
      if (first && bs < fromSec) { pcm = pcm.subarray(Math.min(pcm.length, Math.round((fromSec - bs) * SR))); bs = fromSec; }
      first = false;
      if (pend.length && (Math.abs(bs - (pStart + pend.length / SR)) > 0.5 || failed !== !!pend.failed)) await drain(true);
      if (!pend.length) pStart = bs;
      pend = cat(pend, pcm); if (failed) pend.failed = true;
      await drain(false);
    }
    await drain(true);
    if (S.stop) return;
    if (!S.duration) S.duration = S.processed;
    S.processed = Math.max(S.processed, S.duration);
    await finalize();
    if (!S.playable) setPlayer(await buildListen());
    const sp = S.utts.filter(u => u.kind === 'speech'), gaps = S.utts.filter(u => u.kind !== 'speech');
    ring(100, '完成');
    stage('完成', `共 ${sp.length} 句、${S.final.K} 位講者${gaps.length ? `；${gaps.length} 段需人工確認（紅底）` : ''}`);
    ['bTxt', 'bSrt', 'bDoc'].forEach(i => $(i).disabled = false);
    window.__AVTX.done = true;
  } catch (e) {
    dbg('中斷', e); window.__AVTX.error = String(e && e.message || e);
    if (e && e.unreadable) { stage(e.net ? '無法載入 AI 辨識元件' : '無法處理此檔案', e.message); ring(0, '—'); }
    else stage('處理中斷', '處理過程發生問題（' + (e && e.message ? e.message : '未知錯誤') + '）。已完成的部分已自動保存，重新選擇同一檔案即可從中斷處繼續。');
    if (S.utts.some(u => u.kind === 'speech')) ['bTxt', 'bSrt', 'bDoc'].forEach(i => $(i).disabled = false);
  } finally { S.running = false; try { wakeLock && wakeLock.release(); } catch { } }
}

/* ---------- 呈現 ---------- */
const spkName = k => k < 0 ? '講者 ?' : '講者 ' + letter(k);
const flagsOf = u => [...(u.flags || [])].map(f => LOGIC.FLAG_TEXT[f]).filter(Boolean);
const bodyOf = u => u.lang && u.lang !== 'zh' ? `${u.orig} (${u.zh || '未翻譯'})` : u.text;
function rowHtml(u) {
  const ts = `<a class="ts" data-s="${u.s}">[${fmt(u.s)}]</a>`;
  if (u.kind !== 'speech') return `<div class="u gap">${ts}【${fmt(u.s)}–${fmt(u.e)} ${u.kind === 'fail' ? '此段聲音無法解碼' : '有聲音但未辨識出文字'}，請播放確認】</div>`;
  const fl = flagsOf(u);
  const body = u.lang !== 'zh' ? `${esc(u.orig)} <span class="zh">(${u.zh ? esc(u.zh) : '未翻譯'})</span>` : esc(u.text);
  return `<div class="u${fl.length ? ' warn' : ''}">${ts}<span class="sp" style="color:${COLORS[Math.max(0, u.spk) % COLORS.length]}">${spkName(u.spk)}:</span>${body}${fl.length ? `<span class="tag" title="${esc(fl.join('；'))}">需確認</span>` : ''}</div>`;
}
function render() { $('tx').innerHTML = S.utts.map(rowHtml).join('') || '<div class="empty">沒有偵測到語音</div>'; }
$('tx').addEventListener('click', async e => {
  const a = e.target.closest('.ts'); if (!a) return; e.preventDefault();
  if (!S.playable && S.wins.length && S.listenBuilt !== S.wins.length) setPlayer(await buildListen());
  const p = $('player'); if (!p.src) return;
  const go = () => { p.currentTime = Math.max(0, +a.dataset.s - 0.2); p.play().catch(() => { }); };
  if (p.readyState >= 1) go(); else p.addEventListener('loadedmetadata', go, { once: true });
});

/* ---------- 匯出 ---------- */
function download(name, data, type) { const a = document.createElement('a'); a.href = URL.createObjectURL(data instanceof Blob ? data : new Blob([data], { type })); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 10000); }
const base = () => S.file.name.replace(/\.[^.]+$/, '');
function lineOf(u) {
  if (u.kind !== 'speech') return `[${fmt(u.s)}] 【${fmt(u.s)}–${fmt(u.e)} ${u.kind === 'fail' ? '聲音無法解碼' : '有聲音但未辨識出文字'}，需人工聽寫】`;
  const fl = flagsOf(u); return `[${fmt(u.s)}] ${spkName(u.spk)}: ${bodyOf(u)}${fl.length ? `【需確認：${fl.join('；')}】` : ''}`;
}
$('bTxt').onclick = () => download(base() + '_逐字稿.txt', '\ufeff' + S.utts.map(lineOf).join('\r\n'), 'text/plain;charset=utf-8');
$('bSrt').onclick = () => { const t = s => fmt(s) + ',' + String(Math.floor((s % 1) * 1000)).padStart(3, '0'); download(base() + '.srt', S.utts.filter(u => u.kind === 'speech').map((u, i) => `${i + 1}\r\n${t(u.s)} --> ${t(u.e)}\r\n${spkName(u.spk)}: ${bodyOf(u)}\r\n`).join('\r\n'), 'text/plain;charset=utf-8'); };
$('tpl').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try { const buf = await f.arrayBuffer(); const fl = await DOCX.fields(buf, DOMParser); S.tplBuf = buf; S.tplName = f.name; $('tplName').textContent = `已載入：${f.name}${fl.length ? '｜欄位：' + fl.join('、') : '｜未辨識到欄位，內容將附在文末'}`; }
  catch (err) { S.tplBuf = null; $('tplName').textContent = '範本無法讀取：' + err.message; }
  e.target.value = '';
};
$('bDoc').onclick = async () => {
  try {
    const sp = S.utts.filter(u => u.kind === 'speech');
    const pick = rx => sp.filter(u => rx.test(u.zh || u.text) && (u.zh || u.text).length >= 6).map((u, i) => `（${i + 1}）${spkName(u.spk)}：「${u.lang !== 'zh' ? (u.zh || u.orig) : u.text}」（${fmt(u.s)}）`);
    const note = '※ 依關鍵字自動擷取之發言原句，未經改寫，請確認後定稿。';
    const dec = pick(LOGIC.RX_DECISION), task = pick(LOGIC.RX_TASK);
    const v = { title: base(), attendees: [...new Set(sp.map(u => spkName(u.spk)))].join('、'), content: S.utts.map(lineOf),
      decisions: dec.length ? [note, ...dec] : ['（未擷取到含決議關鍵字之發言，請人工撰寫）'], todos: task.length ? [note, ...task] : ['（未擷取到含待辦關鍵字之發言，請人工撰寫）'] };
    download(base() + '_會議記錄.docx', await DOCX.build(S.tplBuf ? S.tplBuf.slice(0) : null, v, DOMParser, XMLSerializer));
  } catch (e) { dbg('Word 失敗', e); alert('產出會議記錄失敗：' + e.message); }
};

/* ---------- 上傳 ---------- */
const drop = $('drop');
drop.onclick = () => $('file').click();
$('file').onchange = e => { if (e.target.files[0]) selectFile(e.target.files[0]); e.target.value = ''; };
['dragenter', 'dragover'].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.add('on'); }));
['dragleave', 'drop'].forEach(t => drop.addEventListener(t, e => { e.preventDefault(); drop.classList.remove('on'); }));
drop.addEventListener('drop', e => e.dataTransfer.files[0] && selectFile(e.dataTransfer.files[0]));
window.addEventListener('beforeunload', e => { if (S.running) { e.preventDefault(); e.returnValue = ''; } });
})();
</script>
</body>
</html>
